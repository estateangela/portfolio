<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" rx="6" fill="#0b1024"/>
  <!-- stars -->
  <rect x="4" y="5" width="1" height="1" fill="#fff"/>
  <rect x="27" y="6" width="1" height="1" fill="#fff"/>
  <rect x="6" y="26" width="1" height="1" fill="#fff"/>
  <rect x="25" y="25" width="1" height="1" fill="#fff"/>
  <!-- rainbow trail -->
  <rect x="2" y="12" width="14" height="2" fill="#ff2244"/>
  <rect x="2" y="14" width="14" height="2" fill="#ff9d00"/>
  <rect x="2" y="16" width="14" height="2" fill="#ffee00"/>
  <rect x="2" y="18" width="14" height="2" fill="#3cff5a"/>
  <rect x="2" y="20" width="14" height="2" fill="#00b3ff"/>
  <rect x="2" y="22" width="14" height="2" fill="#8a4dff"/>
  <!-- pop-tart body -->
  <rect x="14" y="12" width="10" height="11" rx="2" fill="#e9dcae"/>
  <rect x="15" y="13" width="8" height="9" rx="1.5" fill="#ff9ecb"/>
  <rect x="17" y="15" width="1.4" height="1.4" fill="#ff4fa2"/>
  <rect x="20" y="17" width="1.4" height="1.4" fill="#ff4fa2"/>
  <rect x="18" y="19" width="1.4" height="1.4" fill="#ff4fa2"/>
  <!-- cat head (grey) -->
  <rect x="22" y="11" width="8" height="10" rx="1.5" fill="#a7adb8"/>
  <!-- ears -->
  <rect x="22" y="9" width="2" height="2" fill="#a7adb8"/>
  <rect x="28" y="9" width="2" height="2" fill="#a7adb8"/>
  <!-- eyes -->
  <rect x="24" y="14" width="1.6" height="1.6" fill="#1b1b1b"/>
  <rect x="27.4" y="14" width="1.6" height="1.6" fill="#1b1b1b"/>
  <!-- cheeks -->
  <rect x="23" y="16.5" width="1.6" height="1.6" fill="#ff9ecb"/>
  <rect x="28.4" y="16.5" width="1.6" height="1.6" fill="#ff9ecb"/>
  <!-- mouth -->
  <rect x="25.6" y="17" width="1.8" height="1" fill="#1b1b1b"/>
</svg>
